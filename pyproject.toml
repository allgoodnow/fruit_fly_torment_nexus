[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-fly-torment-nexus"
version = "0.9.0"
description = "Native 3D fruit fly simulation and neural intervention research interface"
requires-python = ">=3.12,<3.15"
dependencies = ["flygym==2.1.0", "PySide6>=6.11,<6.12", "pyqtgraph==0.14.0", "PyOpenGL==3.1.10"]

[project.scripts]
fruit-fly-nexus = "nexus.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexus.brain" = ["intervention-circuits.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
